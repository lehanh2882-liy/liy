<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Present (A1) - Storytelling Practice</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fb;
            color: #1f2937;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 1.45rem;
            text-align: center;
            color: #1e3a8a;
        }

        .controls {
            background: #ffffff;
            padding: 14px 18px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 18px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 860px;
            box-sizing: border-box;
        }

        select, input[type="number"], button {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 0.95rem;
        }

        button {
            background: #2563eb;
            color: #ffffff;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover { background: #1d4ed8; }
        button.secondary { background: #475569; }
        button.secondary:hover { background: #334155; }
        button.active-tab { background: #0f766e; }

        .card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            padding: 20px;
            width: 100%;
            max-width: 860px;
            box-sizing: border-box;
        }

        .stage {
            margin-bottom: 20px;
            padding: 18px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .num-badge {
            display: inline-block;
            background: #2563eb;
            color: #fff;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .active-text {
            font-size: 1.35rem;
            font-weight: 700;
            color: #0f172a;
            margin: 4px 0;
            line-height: 1.4;
        }

        .section-heading {
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #1e3a8a;
            margin: 14px 0 8px;
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .list-item:hover { background: #eff6ff; }

        .list-item.highlighted {
            background: #fef9c3;
            border-color: #eab308;
            font-weight: 700;
        }

        .item-num {
            min-width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #dbeafe;
            color: #1d4ed8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .line-text {
            font-size: 1.03rem;
            line-height: 1.45;
        }
    </style>
</head>
<body>

    <h1>The Present — Storytelling Practice</h1>

    <div class="controls">
        <button id="v1Btn" class="active-tab">Version 1: Full Sentences</button>
        <button id="v2Btn" class="secondary">Version 2: Keywords</button>

        <label for="voiceSelect">Voice (en-US):</label>
        <select id="voiceSelect"></select>

        <label for="rateInput">Speed:</label>
        <input type="number" id="rateInput" value="0.85" step="0.05" min="0.5" max="1.4" style="width: 72px;">

        <button id="playAllBtn">Auto Play</button>
        <button id="stopBtn" class="secondary">Stop</button>
    </div>

    <div class="card">
        <div class="stage">
            <span class="num-badge" id="stageBadge">Sentence 1 / 9</span>
            <div class="active-text" id="stageText">A boy is playing video games on the sofa in a dark room.</div>
        </div>

        <div class="section-heading">Story</div>
        <div id="storyList"></div>

        <div class="section-heading">My feeling</div>
        <div id="feelingList"></div>
    </div>

    <script>
        const items = [
            {
                section: "story",
                full: "A boy is playing video games on the sofa in a dark room.",
                keyword: "PLAYING GAMES IN DARK ROOM"
            },
            {
                section: "story",
                full: "His mom comes home, opens the curtains for sunlight, and gives him a big box.",
                keyword: "MOM OPENS CURTAINS + BIG BOX"
            },
            {
                section: "story",
                full: "Opening the box, he sees a cute yellow puppy and feels very happy.",
                keyword: "SEES CUTE YELLOW PUPPY + HAPPY"
            },
            {
                section: "story",
                full: "Then he sees the puppy has only three legs, so he feels sad and pushes it away.",
                keyword: "THREE LEGS + SAD + PUSHES AWAY"
            },
            {
                section: "story",
                full: "The puppy does not give up, playing happily with a red ball, jumping, falling, and getting up again.",
                keyword: "NOT GIVE UP + RED BALL + GETS UP"
            },
            {
                section: "story",
                full: "Smiling, the boy throws the ball and stands up with his crutches—he has only one leg, too!",
                keyword: "THROWS BALL + CRUTCHES + ONE LEG"
            },
            {
                section: "story",
                full: "He opens the door, and they go outside to play in the sun.",
                keyword: "OPENS DOOR + PLAY IN THE SUN"
            },
            {
                section: "feeling",
                full: "I love this touching story.",
                keyword: "LOVE TOUCHING STORY"
            },
            {
                section: "feeling",
                full: "The brave, happy puppy teaches me to love myself and enjoy life!",
                keyword: "BRAVE PUPPY + LOVE MYSELF + ENJOY LIFE"
            }
        ];

        let mode = 1; // 1: full sentence, 2: keyword
        let isAutoPlaying = false;
        let voices = [];

        const synth = window.speechSynthesis;
        const voiceSelect = document.getElementById("voiceSelect");
        const rateInput = document.getElementById("rateInput");
        const storyList = document.getElementById("storyList");
        const feelingList = document.getElementById("feelingList");

        function loadVoices() {
            voices = synth.getVoices();
            const usVoices = voices.filter(v => v.lang.toLowerCase().includes("en-us"));
            const fallbackVoices = voices.filter(v => v.lang.toLowerCase().startsWith("en"));
            const list = usVoices.length ? usVoices : fallbackVoices;

            voiceSelect.innerHTML = "";
            list.forEach(v => {
                const option = document.createElement("option");
                option.value = v.name;
                option.textContent = `${v.name} (${v.lang})`;
                voiceSelect.appendChild(option);
            });
        }

        loadVoices();
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = loadVoices;
        }

        function renderLists() {
            storyList.innerHTML = "";
            feelingList.innerHTML = "";

            items.forEach((item, idx) => {
                const row = document.createElement("div");
                row.className = "list-item";
                row.id = `row-${idx}`;
                const displayLabel = mode === 1 ? item.full : item.keyword;

                row.innerHTML = `
                    <div class="item-num">${idx + 1}</div>
                    <div class="line-text">${displayLabel}</div>
                `;
                row.onclick = () => {
                    isAutoPlaying = false;
                    speakAt(idx, false);
                };

                if (item.section === "story") {
                    storyList.appendChild(row);
                } else {
                    feelingList.appendChild(row);
                }
            });
        }

        function updateStage(idx) {
            const item = items[idx];
            document.getElementById("stageBadge").textContent = `Sentence ${idx + 1} / ${items.length}`;
            document.getElementById("stageText").textContent = mode === 1 ? item.full : item.keyword;

            document.querySelectorAll(".list-item").forEach(el => el.classList.remove("highlighted"));
            const activeRow = document.getElementById(`row-${idx}`);
            if (activeRow) activeRow.classList.add("highlighted");
        }

        function speakAt(idx, autoNext) {
            if (idx >= items.length) {
                isAutoPlaying = false;
                return;
            }
            synth.cancel();
            updateStage(idx);

            const utter = new SpeechSynthesisUtterance(items[idx].full);
            const selectedName = voiceSelect.value;
            const chosen = voices.find(v => v.name === selectedName);
            if (chosen) utter.voice = chosen;
            utter.lang = "en-US";
            utter.rate = parseFloat(rateInput.value) || 0.85;

            utter.onend = () => {
                if (autoNext && isAutoPlaying) {
                    setTimeout(() => speakAt(idx + 1, true), 450);
                }
            };

            synth.speak(utter);
        }

        document.getElementById("v1Btn").onclick = () => {
            mode = 1;
            document.getElementById("v1Btn").className = "active-tab";
            document.getElementById("v2Btn").className = "secondary";
            renderLists();
            updateStage(0);
        };

        document.getElementById("v2Btn").onclick = () => {
            mode = 2;
            document.getElementById("v2Btn").className = "active-tab";
            document.getElementById("v1Btn").className = "secondary";
            renderLists();
            updateStage(0);
        };

        document.getElementById("playAllBtn").onclick = () => {
            isAutoPlaying = true;
            speakAt(0, true);
        };

        document.getElementById("stopBtn").onclick = () => {
            isAutoPlaying = false;
            synth.cancel();
        };

        renderLists();
        updateStage(0);
    </script>
</body>
</html>
